<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BARSOI PUBLIC SCHOOL - Student Portal</title>
  
  <!-- SweetAlert2 CSS & JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 15px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    .header { background-color: #1a237e; color: white; text-align: center; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .header h2 { margin: 0; font-size: 20px; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
    select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    select:focus, input:focus { border-color: #1a237e; outline: none; }

    .details-card { background: #e8eaf6; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; }
    .details-card p { margin: 5px 0; font-size: 14px; color: #2c3e50; }
    .details-card strong { color: #1a237e; }

    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; display: inline-block; text-align: center; }
    .btn-camera { background: #0288d1; color: white; }
    .btn-gallery { background: #7b1fa2; color: white; }
    .btn-submit { background: #2e7d32; color: white; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }

    .photo-btn-container { display: flex; gap: 10px; margin-top: 10px; }
    .photo-btn-container .btn { margin-top: 0; flex: 1; }

    .preview-img { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; margin: 10px auto; border: 3px solid #1a237e; display: block; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>BARSOI PUBLIC SCHOOL</h2>
    <p style="margin: 5px 0 0 0; font-size: 13px;">Student Details & Photo Update</p>
  </div>

  <div class="form-group">
    <label for="classSelect">1. Select Class:</label>
    <select id="classSelect" onchange="loadStudents()">
      <option value="">-- Select Class --</option>
      <option value="Nursery">Nursery</option>
      <option value="LKG">LKG</option>
      <option value="UKG">UKG</option>
      <option value="1st">1st</option>
      <option value="2nd">2nd</option>
      <option value="3rd">3rd</option>
      <option value="4th">4th</option>
      <option value="5th">5th</option>
      <option value="6th">6th</option>
      <option value="7th">7th</option>
      <option value="8th">8th</option>
      <option value="9th">9th</option>
      <option value="10th">10th</option>
    </select>
  </div>

  <div class="form-group" id="studentGroup" style="display: none;">
    <label for="studentSelect">2. Select Student:</label>
    <select id="studentSelect" onchange="showStudentDetails()">
      <option value="">-- Select Student --</option>
    </select>
  </div>

  <div class="details-card" id="detailsCard">
    <p><strong>Reg No/ Student ID:</strong> <span id="lblReg"></span></p>
    <p><strong>Student Name:</strong> <span id="lblName"></span></p>
    <p><strong>Father Name:</strong> <span id="lblFather"></span></p>
    <p><strong>DOB:</strong> <span id="lblDob"></span></p>
    <p><strong>Address:</strong> <span id="lblAddress"></span></p>
    <p><strong>Contact:</strong> <span id="lblContact"></span></p>
  </div>

  <div id="updateForm" style="display: none;">
    <div class="form-group">
      <label for="rollNo">Roll No:</label>
      <input type="text" id="rollNo" placeholder="Enter Roll No ">
    </div>

    <div class="form-group">
      <label for="motherName">Mother's Name:</label>
      <input type="text" id="motherName" placeholder=" Type Mother's Name  ">
    </div>

    <div style="text-align: center;">
      <img id="photoPreview" class="preview-img" src="https://via.placeholder.com/120?text=No+Photo" alt="Photo Preview">
      
      <!-- Separate Hidden File Inputs for Camera and Gallery -->
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="handleImageCapture(event)">
      <input type="file" id="galleryInput" accept="image/*" style="display: none;" onchange="handleImageCapture(event)">
      
      <!-- Dual Option Buttons -->
      <div class="photo-btn-container">
        <button type="button" class="btn btn-camera" onclick="triggerCamera()">📷 Camera</button>
        <button type="button" class="btn btn-gallery" onclick="triggerGallery()">📁 Gallery</button>
      </div>
    </div>

    <button class="btn btn-submit" id="btnSubmit" onclick="submitData()">Save & Submit Data</button>
  </div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNDGJ0hRQYq092gKL7fDgdwEOHgWxpDLOWFoI9SACghFLwL5Os1zOUoH2OBfxa_reN/exec"; 

  let studentsData = [];
  let selectedStudent = null;
  let capturedBase64 = "";

  // Helper Function: Sheet me chahe "Reg No", "Reg No/ Student ID" ya kuch bhi likha ho, ye automatically dhundh lega
  function getRegValue(obj) {
    if (!obj) return "";
    for (let key in obj) {
      const cleanKey = key.trim().toLowerCase();
      if (cleanKey.includes("reg") || cleanKey.includes("student id") || cleanKey.includes("id")) {
        if (obj[key] !== undefined && obj[key] !== null && obj[key] !== "") {
          return obj[key];
        }
      }
    }
    return obj.regNo || obj["Reg No"] || obj["Reg No/ Student ID"] || "";
  }

  async function loadStudents() {
    const className = document.getElementById('classSelect').value;
    if (!className) return;

    Swal.fire({
      title: 'Loading Data...',
      text: 'Please wait while fetching students list.',
      allowOutsideClick: false,
      didOpen: () => { Swal.showLoading(); }
    });

    document.getElementById('studentGroup').style.display = 'none';
    document.getElementById('detailsCard').style.display = 'none';
    document.getElementById('updateForm').style.display = 'none';

    try {
      const response = await fetch(`${WEB_APP_URL}?action=getStudents&className=${encodeURIComponent(className)}`);
      const data = await response.json();
      
      Swal.close();
      
      if (data.status === "success" && data.students) {
        populateStudents(data.students);
      } else if (Array.isArray(data)) {
        populateStudents(data);
      } else {
        Swal.fire('Notice', 'Data empty or could not load.', 'info');
      }
    } catch (err) {
      Swal.fire('Error!', 'Data fetching.... Please try again.', 'error');
      console.error(err);
    }
  }

  function populateStudents(data) {
    studentsData = data || [];
    const select = document.getElementById('studentSelect');
    select.innerHTML = '<option value="">-- Select Student --</option>';
    
    studentsData.forEach((st, idx) => {
      const regId = getRegValue(st) || 'No ID';
      const studentName = st.name || st.studentName || st["Student Name"] || st["NAME"] || "Unknown";
      select.innerHTML += `<option value="${idx}">${studentName} (${regId})</option>`;
    });

    document.getElementById('studentGroup').style.display = 'block';
  }

  function showStudentDetails() {
    const index = document.getElementById('studentSelect').value;
    if (index === "") {
      document.getElementById('detailsCard').style.display = 'none';
      document.getElementById('updateForm').style.display = 'none';
      return;
    }

    selectedStudent = studentsData[index];

    const regId = getRegValue(selectedStudent);
    document.getElementById('lblReg').innerText = regId || '-';
    document.getElementById('lblName').innerText = selectedStudent.name || selectedStudent.studentName || selectedStudent["Student Name"] || '-';
    document.getElementById('lblFather').innerText = selectedStudent.fatherName || selectedStudent["Father Name"] || '-';
    document.getElementById('lblDob').innerText = selectedStudent.dob || selectedStudent["DOB"] || '-';
    document.getElementById('lblAddress').innerText = selectedStudent.address || selectedStudent["Address"] || '-';
    document.getElementById('lblContact').innerText = selectedStudent.contact || selectedStudent["Contact"] || selectedStudent["Mobile"] || '-';

    document.getElementById('rollNo').value = selectedStudent.rollNo || selectedStudent["Roll No"] || '';
    document.getElementById('motherName').value = selectedStudent.motherName || selectedStudent["Mother's Name"] || selectedStudent["Mother Name"] || '';

    if (selectedStudent.photoUrl || selectedStudent["Photo"]) {
      document.getElementById('photoPreview').src = selectedStudent.photoUrl || selectedStudent["Photo"];
    } else {
      document.getElementById('photoPreview').src = "https://via.placeholder.com/120?text=No+Photo";
    }

    capturedBase64 = ""; // Reset captured photo
    document.getElementById('detailsCard').style.display = 'block';
    document.getElementById('updateForm').style.display = 'block';
  }

  // Camera Trigger
  function triggerCamera() {
    document.getElementById('cameraInput').click();
  }

  // Gallery Trigger
  function triggerGallery() {
    document.getElementById('galleryInput').click();
  }

  // Handle selected photo from Camera OR Gallery (Medium Quality Compression ~50-80KB)
  function handleImageCapture(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        // Medium Quality Resolution (Max Dimension: 500px)
        const canvas = document.createElement('canvas');
        const MAX_SIZE = 500; 

        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > MAX_SIZE) {
            height *= MAX_SIZE / width;
            width = MAX_SIZE;
          }
        } else {
          if (height > MAX_SIZE) {
            width *= MAX_SIZE / height;
            height = MAX_SIZE;
          }
        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // Medium JPEG Quality (65%) for sharp picture & moderate size
        capturedBase64 = canvas.toDataURL('image/jpeg', 0.65);
        document.getElementById('photoPreview').src = capturedBase64;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function submitData() {
    const rollNo = document.getElementById('rollNo').value;
    const motherName = document.getElementById('motherName').value;

    if (!selectedStudent) return;

    const regValue = getRegValue(selectedStudent);

    // Dynamic Payload: `Code.gs` ke dono tarike ke payload formats ko accept karne ke liye
    const payload = {
      className: document.getElementById('classSelect').value,
      rowIndex: selectedStudent.rowIndex,
      regNo: regValue,
      "Reg No": regValue,
      "Reg No/ Student ID": regValue,
      studentName: selectedStudent.name || selectedStudent.studentName || selectedStudent["Student Name"],
      rollNo: rollNo,
      motherName: motherName,
      photoBase64: capturedBase64
    };

    Swal.fire({
      title: 'Saving Data...',
      text: 'Please wait while updating details.',
      allowOutsideClick: false,
      didOpen: () => { Swal.showLoading(); }
    });

    document.getElementById('btnSubmit').disabled = true;

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      document.getElementById('btnSubmit').disabled = false;
      
      // Update local memory data
      selectedStudent.rollNo = rollNo;
      selectedStudent.motherName = motherName;

      Swal.fire({
        title: 'Success!',
        text: 'Data successfully saved & updated!',
        icon: 'success',
        confirmButtonColor: '#1a237e'
      }).then(() => {
        // Reset form for next student selection
        document.getElementById('studentSelect').value = "";
        document.getElementById('detailsCard').style.display = 'none';
        document.getElementById('updateForm').style.display = 'none';
        document.getElementById('cameraInput').value = "";
        document.getElementById('galleryInput').value = "";
      });
    })
    .catch(err => {
      document.getElementById('btnSubmit').disabled = false;
      Swal.fire('Error!', 'Save data, error occured: ' + err, 'error');
    });
  }
</script>

</body>
</html>
